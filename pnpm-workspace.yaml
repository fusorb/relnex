allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': true
  '@tree-sitter-grammars/tree-sitter-yaml': true
  core-js-pure: true
  prisma: true
  sharp: true
  tree-sitter: true
  tree-sitter-json: true
  unrs-resolver: true

ignoredBuiltDependencies:
  - unrs-resolver

minimumReleaseAgeExclude:
  - '@fusorb/facet-auth@2.0.0 || 2.0.1 || 2.0.2 || 2.1.0'
  - '@fusorb/facet-layout@1.6.0 || 1.7.1 || 1.7.2'
  - '@fusorb/facet-sdk@2.0.0 || 2.1.0 || 2.1.1'
  - '@fusorb/facet-store@1.0.2 || 1.0.3 || 1.0.4'
  - '@fusorb/facet-components@3.2.0 || 3.2.1'
  - '@fusorb/facet-motion@1.2.2'
  - '@fusorb/facet-tokens@1.5.1'
  - '@fusorb/facet-utils@0.1.1'

onlyBuiltDependencies:
  - "@prisma/engines"
  - "@scarf/scarf"
  - "@tailwindcss/oxide"
  - "@tree-sitter-grammars/tree-sitter-yaml"
  - core-js-pure
  - prisma
  - sharp
  - tree-sitter
  - tree-sitter-json
