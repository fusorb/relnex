allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': true
  '@tree-sitter-grammars/tree-sitter-yaml': true
  core-js-pure: true
  prisma: true
  sharp: true
  tree-sitter: true
  tree-sitter-json: true
  unrs-resolver: true

ignoredBuiltDependencies:
  - unrs-resolver

minimumReleaseAgeExclude:
  - '@fusorb/facet-auth@2.0.0'
  - '@fusorb/facet-layout@1.6.0'
  - '@fusorb/facet-sdk@2.0.0'
  - '@fusorb/facet-store@1.0.2'

onlyBuiltDependencies:
  - "@prisma/engines"
  - "@scarf/scarf"
  - "@tailwindcss/oxide"
  - "@tree-sitter-grammars/tree-sitter-yaml"
  - core-js-pure
  - prisma
  - sharp
  - tree-sitter
  - tree-sitter-json
