name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders: the app must compile without live secrets.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/relnex?schema=public
      SG_API_URL: http://localhost:4000
      SG_CLIENT_ID: relnex
      SG_ISSUER: sovgrant
      SG_JWT_SECRET: ci-placeholder-secret
      SG_WEBHOOK_SECRET: ci-placeholder-secret
      # src/lib/storage/s3.ts throws at import if storage creds are absent.
      STORAGE_ACCESS_KEY_ID: ci-placeholder
      STORAGE_SECRET_ACCESS_KEY: ci-placeholder
      STORAGE_BUCKET_NAME: relnex-ci
      STORAGE_REGION: auto
    steps:
      - uses: actions/checkout@v4
      # pnpm version is sourced from package.json#packageManager (single source of truth).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:all
